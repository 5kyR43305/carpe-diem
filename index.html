<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="description" content="League of Legends & VALORANT fan quizzes · 리그 오브 레전드 & 발로란트 팬 퀴즈">
<title>Game Quiz</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-title-key="hubTitle">
<main class="wrap">
  <section class="hero">
    <h1>Game <span>Quiz</span></h1>
    <p data-i18n="hubSub"></p>
    <p class="hero-note" data-i18n="hubNote"></p>
  </section>
  <section class="quiz-list" id="quizList"></section>
</main>

<script src="assets/js/common.js"></script>
<script src="assets/js/quizzes.js"></script>
<script>
(function () {
  App.addStrings({
    ko: { hubTitle: 'Game Quiz · 리그 오브 레전드 & 발로란트', hubSub: '게임에 대해 얼마나 알고 계신가요?', hubNote: '(퀴즈 항목은 추후 업데이트됩니다.)' },
    en: { hubTitle: 'Game Quiz · League of Legends & VALORANT', hubSub: 'How well do you know your games?', hubNote: '(More quizzes coming soon)' },
  });

  const list = document.getElementById('quizList');
  function render() {
    list.innerHTML = '';
    window.QUIZZES.forEach((q) => {
      const a = document.createElement('a');
      a.className = 'quiz-card ' + q.game;
      a.href = q.href;
      if (q.image) {
        const img = document.createElement('img');
        img.className = 'bg';
        img.alt = '';
        img.loading = 'lazy';
        img.src = q.image;
        img.onerror = () => img.remove();
        a.appendChild(img);
      }
      const tag = document.createElement('span');
      tag.className = 'tag ' + q.game;
      tag.textContent = App.L(q.tag);
      const h = document.createElement('h2');
      h.textContent = App.L(q.title);
      const p = document.createElement('p');
      p.textContent = App.L(q.desc);
      a.append(tag, h, p);
      list.appendChild(a);
    });
  }

  App.mountChrome();
  render();
  App.onLang(render);
})();
</script>
</body>
</html>
