<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>LoL 챔피언 랜덤 뽑기</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-title-key="pageTitle" data-legal="riot">
<main class="wrap rp">
  <h1 class="page-title" data-i18n="title"></h1>
  <p class="page-sub" data-i18n="sub"></p>
  <div class="status" id="status" data-i18n="loading"></div>

  <section class="panel rp-setup" id="setup" hidden>
    <div class="rp-row">
      <div class="rp-label" data-i18n="countLabel"></div>
      <div class="seg rp-count" id="countSeg"></div>
    </div>
    <div class="rp-row">
      <div class="rp-label"><span data-i18n="roleLabel"></span> <small id="roleNote"></small></div>
      <div class="rp-roles" id="roles"></div>
    </div>
    <button type="button" class="btn btn-primary btn-lg rp-go" id="drawBtn" data-i18n="draw"></button>
  </section>

  <section class="rp-result" id="result"></section>
</main>

<script src="assets/js/common.js"></script>
<script src="assets/js/random-picker.js"></script>
<script src="assets/js/lol-random.js"></script>
</body>
</html>
